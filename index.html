<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercari 報價助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 80px; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-2xl mx-auto">

  <!-- ==================== 分頁一：報價助手 ==================== -->
  <div id="tab1" class="tab-content">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-red-500 flex items-center justify-center text-white font-bold text-xl">M</div>
        <div>
          <h1 class="text-xl font-bold text-slate-800">Mercari 報價助手</h1>
          <p class="text-xs text-slate-500">日本/台灣代購即時抓取與計算</p>
        </div>
      </div>

      <label class="block text-sm font-semibold text-slate-700 mb-2">直接貼上客人的對話訊息（自動識別台/日煤爐網址）</label>
      <textarea id="urlInput" rows="5" class="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-sm mb-4" placeholder="貼上含有網址的對話訊息..."></textarea>

      <button onclick="fetchPrices()" id="fetchBtn" class="w-full py-3 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl transition shadow-sm flex items-center justify-center gap-2">
        <span>自動辨識網址並報價</span>
      </button>
    </div>

    <!-- 結果清單 -->
    <div id="resultsList" class="space-y-4 mb-6"></div>

    <!-- 報價總計與複製 -->
    <div id="summaryCard" class="hidden bg-slate-900 text-white rounded-2xl p-6 shadow-lg mb-6">
      <div class="flex justify-between items-end mb-4 border-b border-slate-800 pb-4">
        <div>
          <p class="text-xs text-slate-400">總計預估台幣 (已套用 0/5 進位)</p>
          <p id="totalTwd" class="text-3xl font-extrabold text-emerald-400">NT$ 0</p>
        </div>
        <div class="text-right">
          <p class="text-xs text-slate-400">日幣商品總額</p>
          <p id="totalJpy" class="text-lg font-semibold">¥0</p>
        </div>
      </div>
      <button onclick="copyQuote()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold rounded-xl transition flex items-center justify-center gap-2">
        複製完整報價文字
      </button>
    </div>
  </div>

  <!-- ==================== 分頁二：系統設定 ==================== -->
  <div id="tab2" class="tab-content hidden">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
      <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100">⚙️ 匯率與費用設定</h2>
      
      <div class="space-y-4 mb-6">
        <!-- 國際即時匯率 -->
        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100 flex items-center justify-between">
          <div>
            <p class="text-xs font-semibold text-slate-500">國際即時匯率 (日幣 → 台幣)</p>
            <p id="realtimeRateDisplay" class="text-sm font-bold text-slate-800 mt-0.5">抓取中...</p>
          </div>
          <button onclick="fetchRealtimeRate()" class="text-xs text-red-500 hover:text-red-600 font-semibold underline">重新整理</button>
        </div>

        <!-- 設定匯率 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">設定匯率 (手動輸入，預設 0.22)</label>
          <input type="number" id="rate" value="0.22" step="0.001" oninput="saveAndCalculate()" class="w-full p-2.5 rounded-lg border border-slate-200 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 outline-none">
        </div>

        <!-- 代購費率 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">代購費率 (%) (手動輸入，預設 17.5%)</label>
          <input type="number" id="feePercent" value="17.5" step="0.1" oninput="saveAndCalculate()" class="w-full p-2.5 rounded-lg border border-slate-200 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 outline-none">
        </div>
      </div>

      <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100">📝 報價複製範本自訂</h2>

      <div class="space-y-4">
        <!-- 開頭問候語 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">開頭問候語文字</label>
          <textarea id="tplHeader" rows="2" oninput="saveSettingsOnly()" class="w-full p-2.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 outline-none" placeholder="例如：您好 感謝詢問✨✨&#10;以上物品報價"></textarea>
        </div>

        <!-- 運費說明文字 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">商品列表下方備註（如運費說明）</label>
          <input type="text" id="tplShippingNote" oninput="saveSettingsOnly()" class="w-full p-2.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 outline-none" placeholder="例如：(不含國際運費&台灣運費)">
        </div>

        <!-- 結尾匯款說明 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">結尾說明文字（如匯款方式）</label>
          <textarea id="tplFooter" rows="2" oninput="saveSettingsOnly()" class="w-full p-2.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-800 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 outline-none" placeholder="例如：匯款方式：線上轉帳、無卡匯款 (需先確認需匯款金額)"></textarea>
        </div>
      </div>

      <p class="text-[11px] text-slate-400 mt-4">* 修改後會自動儲存設定，下次開啟網頁無需重複輸入。</p>
    </div>
  </div>

  <!-- ==================== 底部固定切換導覽列 ==================== -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex justify-around items-center z-50">
    <button onclick="switchTab(1)" id="tabBtn1" class="flex flex-col items-center text-red-500 font-bold">
      <span class="text-xl">🛒</span>
      <span class="text-xs">報價計算</span>
    </button>
    <button onclick="switchTab(2)" id="tabBtn2" class="flex flex-col items-center text-slate-400 font-medium">
      <span class="text-xl">⚙️</span>
      <span class="text-xs">系統設定</span>
    </button>
  </div>

  <script>
    const WORKER_API_URL = "https://mercari-api.910pigshop.workers.dev";
    let fetchedItems = [];

    // 預設報價範本
    const DEFAULT_HEADER = "您好 感謝詢問✨✨\n以上物品報價";
    const DEFAULT_SHIPPING = "(不含國際運費&台灣運費)";
    const DEFAULT_FOOTER = "匯款方式：線上轉帳、無卡匯款 (需先確認需匯款金額)";

    // 初始化：載入歷史設定與抓取即時匯率
    window.addEventListener("DOMContentLoaded", () => {
      loadSettings();
      fetchRealtimeRate();
    });

    // 分頁切換邏輯
    function switchTab(tabNum) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab${tabNum}`).classList.remove('hidden');

      const btn1 = document.getElementById('tabBtn1');
      const btn2 = document.getElementById('tabBtn2');

      if (tabNum === 1) {
        btn1.className = "flex flex-col items-center text-red-500 font-bold";
        btn2.className = "flex flex-col items-center text-slate-400 font-medium";
      } else {
        btn1.className = "flex flex-col items-center text-slate-400 font-medium";
        btn2.className = "flex flex-col items-center text-red-500 font-bold";
      }
    }

    // 載入與儲存記憶
    function loadSettings() {
      const savedRate = localStorage.getItem("mercari_rate");
      const savedFee = localStorage.getItem("mercari_fee");
      const savedHeader = localStorage.getItem("mercari_tpl_header");
      const savedShipping = localStorage.getItem("mercari_tpl_shipping");
      const savedFooter = localStorage.getItem("mercari_tpl_footer");

      if (savedRate !== null) document.getElementById("rate").value = savedRate;
      if (savedFee !== null) document.getElementById("feePercent").value = savedFee;
      
      document.getElementById("tplHeader").value = savedHeader !== null ? savedHeader : DEFAULT_HEADER;
      document.getElementById("tplShippingNote").value = savedShipping !== null ? savedShipping : DEFAULT_SHIPPING;
      document.getElementById("tplFooter").value = savedFooter !== null ? savedFooter : DEFAULT_FOOTER;
    }

    function saveSettingsOnly() {
      localStorage.setItem("mercari_rate", document.getElementById("rate").value);
      localStorage.setItem("mercari_fee", document.getElementById("feePercent").value);
      localStorage.setItem("mercari_tpl_header", document.getElementById("tplHeader").value);
      localStorage.setItem("mercari_tpl_shipping", document.getElementById("tplShippingNote").value);
      localStorage.setItem("mercari_tpl_footer", document.getElementById("tplFooter").value);
    }

    function saveAndCalculate() {
      saveSettingsOnly();
      renderItems();
      calculateTotal();
    }

    // 抓取當天國際即時匯率
    async function fetchRealtimeRate() {
      const display = document.getElementById("realtimeRateDisplay");
      display.innerText = "讀取中...";
      try {
        const res = await fetch("https://open.er-api.com/v6/latest/JPY");
        if (res.ok) {
          const data = await res.json();
          const twdRate = data?.rates?.TWD;
          if (twdRate) {
            display.innerText = `1 JPY ≈ ${twdRate.toFixed(4)} TWD`;
            return;
          }
        }
        display.innerText = "無法取得即時匯率";
      } catch (e) {
        display.innerText = "無法取得即時匯率";
      }
    }

    // 特殊進位邏輯 (個位數 1-4 -> 5, 6-9 -> 0, 0/5不變)
    function adjustRoundPrice(val) {
      let rounded = Math.round(val);
      let lastDigit = rounded % 10;

      if (lastDigit >= 1 && lastDigit <= 4) {
        return rounded + (5 - lastDigit);
      } else if (lastDigit >= 6 && lastDigit <= 9) {
        return rounded + (10 - lastDigit);
      }
      return rounded;
    }

    // 計算單件商品台幣金額
    function calculateSingleTwd(jpyPrice) {
      if (!jpyPrice || jpyPrice <= 0) return 0;
      const rate = parseFloat(document.getElementById("rate").value) || 0;
      const feePercent = parseFloat(document.getElementById("feePercent").value) || 0;
      const rawTwd = jpyPrice * rate * (1 + feePercent / 100);
      return adjustRoundPrice(rawTwd);
    }

    async function fetchPrices() {
      const rawText = document.getElementById("urlInput").value.trim();
      const urlMatches = rawText.match(/https?:\/\/[^\s\n]*mercari\.com[^\s\n]*/gi);

      if (!urlMatches || urlMatches.length === 0) {
        alert("文字中未偵測到有效的 Mercari 商品網址！");
        return;
      }

      const urls = [...new Set(urlMatches.map(u => u.trim()))];
      const fetchBtn = document.getElementById("fetchBtn");
      fetchBtn.disabled = true;
      fetchBtn.innerHTML = `<span>已識別 ${urls.length} 個網址，解析中...</span>`;

      try {
        const response = await fetch(WORKER_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ urls })
        });

        const result = await response.json();
        if (result.success) {
          fetchedItems = result.data;
          renderItems();
          calculateTotal();
        } else {
          alert("自動抓取失敗：" + (result.error || "伺服器無回應"));
        }
      } catch (err) {
        alert("連線失敗，請檢查網路。");
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerHTML = `<span>自動辨識網址並報價</span>`;
      }
    }

    function editItemPrice(index) {
      const currentPrice = fetchedItems[index].price || 0;
      const input = prompt("請輸入修改後的日幣金額:", currentPrice);
      if (input === null) return;

      const newPrice = parseInt(input, 10);
      if (!isNaN(newPrice) && newPrice >= 0) {
        fetchedItems[index].price = newPrice;
        fetchedItems[index].isManual = true;
        renderItems();
        calculateTotal();
      } else {
        alert("請輸入有效的數字！");
      }
    }

    function renderItems() {
      const list = document.getElementById("resultsList");
      list.innerHTML = "";

      fetchedItems.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-2xl p-5 border border-slate-200 shadow-sm relative";

        if (!item.success) {
          const singleTwd = calculateSingleTwd(item.price);
          
          card.innerHTML = `
            <div class="mb-2">
              <span class="inline-block bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-md">⚠️ 請手動確認商品金額及內容</span>
            </div>
            <p class="text-xs text-slate-500 mb-3 truncate">原網址: <a href="${item.originalUrl || item.url}" target="_blank" class="text-red-500 hover:underline">${item.originalUrl || item.url}</a></p>
            
            <div class="space-y-3">
              <!-- 手動商品名稱欄位 -->
              <div class="flex items-center gap-3">
                <label class="text-xs font-semibold text-slate-700 whitespace-nowrap min-w-[120px]">手動商品名稱:</label>
                <input type="text" value="${item.manualTitle || ''}" placeholder="例如：日版商品名稱 / 自訂名稱" oninput="updateManualTitle(${index}, this.value)" class="w-full px-3 py-2 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-slate-800">
              </div>

              <!-- 手動日幣價格欄位 -->
              <div class="flex items-center gap-3">
                <label class="text-xs font-semibold text-slate-700 whitespace-nowrap min-w-[120px]">手動填寫日幣價格:</label>
                <div class="relative flex-1">
                  <span class="absolute left-3 top-2.5 text-slate-400 text-sm">¥</span>
                  <input type="number" value="${item.price || ''}" placeholder="輸入金額" oninput="updateManualPrice(${index}, this.value)" class="w-full pl-7 pr-3 py-2 text-sm font-bold rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-slate-800">
                </div>
              </div>

              <!-- 手動日本頁面網址欄位 -->
              <div class="flex items-center gap-3">
                <label class="text-xs font-semibold text-slate-700 whitespace-nowrap min-w-[120px]">手動日本頁面網址:</label>
                <input type="url" value="${item.manualJpUrl || ''}" placeholder="https://jp.mercari.com/item/m..." oninput="updateManualUrl(${index}, this.value)" class="w-full px-3 py-2 text-xs rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-slate-800">
              </div>

              <!-- 即時台幣金額顯示列 -->
              <div class="flex justify-between items-center text-sm pt-2 border-t border-slate-100">
                <span class="text-slate-500 text-xs font-semibold">預估台幣金額:</span>
                <span class="font-bold text-emerald-600 text-base single-twd-display">NT$ ${singleTwd.toLocaleString()}</span>
              </div>
            </div>
          `;
        } else {
          const twBadge = item.isTaiwanUrl 
            ? `<span class="inline-block bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-md mb-2 mr-2">🇹🇼 台灣煤爐網址轉換</span>` 
            : ``;

          const warningBadge = item.isChakubarai 
            ? `<span class="inline-block bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-md mb-2">⚠️ 不含送料 (着払い / 買家負擔運費)</span>` 
            : `<span class="inline-block bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-md mb-2">✅ 送料込み (賣家負擔運費)</span>`;

          const singleTwd = calculateSingleTwd(item.price);
          const displayJpUrl = item.manualJpUrl || item.jpUrl || item.originalUrl || item.url;

          card.innerHTML = `
            <div>
              ${twBadge}${warningBadge}
            </div>
            <h3 class="text-sm font-semibold text-slate-800 mb-2 line-clamp-2">${item.title}</h3>
            
            <div class="space-y-1.5 mb-3">
              <div class="flex justify-between items-center text-sm">
                <span class="text-slate-500">日幣價格:</span>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-slate-900 text-base">¥${(item.price || 0).toLocaleString()}</span>
                  <button onclick="editItemPrice(${index})" class="text-[11px] text-red-500 hover:text-red-600 bg-red-50 px-2 py-0.5 rounded font-medium border border-red-100 transition">手動修改</button>
                </div>
              </div>
              <div class="flex justify-between items-center text-sm">
                <span class="text-slate-500">預估台幣:</span>
                <span class="font-bold text-emerald-600 text-base">NT$ ${singleTwd.toLocaleString()}</span>
              </div>
            </div>

            <div class="border-t border-slate-100 pt-3 flex items-center justify-between text-xs text-slate-500">
              <span>日本頁面網址:</span>
              <a href="${displayJpUrl}" target="_blank" class="text-red-500 hover:text-red-600 font-medium truncate max-w-[300px] hover:underline">${displayJpUrl}</a>
            </div>
          `;
        }
        list.appendChild(card);
      });

      document.getElementById("summaryCard").classList.remove("hidden");
    }

    function updateManualTitle(index, val) {
      fetchedItems[index].manualTitle = val.trim();
    }

    function updateManualPrice(index, val) {
      const price = parseInt(val, 10);
      if (!isNaN(price) && price >= 0) {
        fetchedItems[index].price = price;
      } else {
        fetchedItems[index].price = 0;
      }
      calculateTotal();
      
      // 即時更新該張手輸卡片內的單件預估台幣，避免重構 DOM
      const singleTwdEl = document.querySelectorAll("#resultsList > div")[index]?.querySelector(".single-twd-display");
      if (singleTwdEl) {
        const singleTwd = calculateSingleTwd(fetchedItems[index].price);
        singleTwdEl.innerText = `NT$ ${singleTwd.toLocaleString()}`;
      }
    }

    function updateManualUrl(index, val) {
      fetchedItems[index].manualJpUrl = val.trim();
    }

    function calculateTotal() {
      const rate = parseFloat(document.getElementById("rate").value) || 0;
      const feePercent = parseFloat(document.getElementById("feePercent").value) || 0;

      let totalJpy = 0;
      fetchedItems.forEach(item => {
        if (item.price && item.price > 0) {
          totalJpy += item.price;
        }
      });

      // 原始預估金額
      const rawTwd = totalJpy * rate * (1 + feePercent / 100);
      // 特殊進位邏輯 (1-4 -> 5, 6-9 -> 0)
      const adjustedTwd = adjustRoundPrice(rawTwd);

      document.getElementById("totalJpy").innerText = `¥${totalJpy.toLocaleString()}`;
      document.getElementById("totalTwd").innerText = `NT$ ${adjustedTwd.toLocaleString()}`;
    }

    function copyQuote() {
      const headerText = document.getElementById("tplHeader").value.trim();
      const shippingNote = document.getElementById("tplShippingNote").value.trim();
      const footerText = document.getElementById("tplFooter").value.trim();
      const totalTwdVal = document.getElementById("totalTwd").innerText.replace("NT$", "").trim();
      
      let text = "";

      // 1. 開頭問候語
      if (headerText) {
        text += `${headerText}\n--------------------\n`;
      }

      // 2. 商品清單
      let validCount = 0;
      fetchedItems.forEach((item, i) => {
        if (item.success || (item.price && item.price > 0)) {
          validCount++;
          const title = item.manualTitle || item.title || `商品 (${i + 1})`;
          const displayUrl = item.manualJpUrl || item.jpUrl || item.originalUrl || item.url;
          const singleTwd = calculateSingleTwd(item.price);

          text += `${validCount}. ${title} ($${singleTwd.toLocaleString()})\n`;
          text += `   ${displayUrl}\n\n`;
        }
      });

      // 3. 運費說明
      if (shippingNote) {
        text += `${shippingNote}\n`;
      }

      text += `--------------------\n`;

      // 4. 總計與結尾說明
      text += `總計金額：NT$ ${totalTwdVal}\n`;
      if (footerText) {
        text += `${footerText}`;
      }

      navigator.clipboard.writeText(text).then(() => {
        alert("報價文字已按照自訂範本複製到剪貼簿！");
      });
    }
  </script>
</body>
</html>
